# Desenvolvimento local. A aplicação usa Prisma para acessar os dados.
project_id = "ticket-engine"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Os dados da aplicação não precisam ser expostos pela Data API local.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/api/auth/callback",
  "http://localhost:3000/api/auth/callback?next=/atualizar-senha",
  "http://127.0.0.1:3000/api/auth/callback",
]
enable_signup = true
minimum_password_length = 6

[auth.email]
enabled = true
# Facilita cadastro e login sem um provedor externo em desenvolvimento.
enable_confirmations = false

# Não há consumidores desses serviços no app atual.
[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[storage.vector]
enabled = false
